name: Incorrect command
description: یک دستور یا فایل پیکربندی در دانشنامه روی Ubuntu یا Debian خطا می‌دهد.
title: "fix: "
labels:
  - documentation
body:
  - type: input
    id: page
    attributes:
      label: صفحه
    validations:
      required: true
  - type: input
